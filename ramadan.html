<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رمضان | شهر الخير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#050b19;--gold:#d6b765;--cream:#fff6dc}
*{box-sizing:border-box}
html,body{margin:0}
body{
 background:var(--navy);color:var(--cream);
 font-family:Cairo,Tahoma,Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 min-height:100vh;padding:16px
}
.app{width:min(100%,430px)}
.video{
 position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;
 border:1px solid var(--gold);border-radius:18px;
 background:var(--navy);box-shadow:0 0 40px rgba(214,183,101,.25);
}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.controls{display:grid;gap:10px;padding-top:14px}
.track{height:5px;background:#263450;border-radius:8px;overflow:hidden}
#bar{height:100%;width:0;background:#ffdf91}
#clock{text-align:center;font-size:14px;color:#dfc58d}
.row{display:flex;gap:8px}
.row button{flex:1}
button{
 background:#172543;color:#fff;border:1px solid #c9a755;
 padding:13px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer
}
button:disabled{opacity:.5;cursor:default}
.primary{background:#c49a42;color:#10172a;font-weight:700}
label{font-size:13px;color:#f1d99e}
input[type=range]{width:100%}
#status{text-align:center;font-size:13px;color:#f1d99e;min-height:1.6em}
#download{color:#ffe4a0;text-align:center;padding:10px;font-weight:700}
</style>
</head>
<body>
<div class="app">
 <div class="video"><canvas id="stage" aria-label="معاينة فيديو رمضان"></canvas></div>

 <div class="controls">
  <div class="track"><div id="bar"></div></div>
  <div id="clock">00:00 / 01:00</div>
  <div class="row">
   <button id="play">▶ تشغيل</button>
   <button id="reset">↻ إعادة</button>
  </div>

  <label for="audioFile">إضافة تعليق صوتي أو موسيقى (MP3 أو WAV) - اختياري</label>
  <input id="audioFile" type="file" accept="audio/*">

  <label for="volume">مستوى الصوت</label>
  <input id="volume" type="range" min="0" max="1" step=".05" value="1">

  <button class="primary" id="export">تصدير الفيديو كاملاً (دقيقة واحدة)</button>
  <div id="status">جارٍ تحميل المشاهد...</div>
  <a id="download" hidden>تنزيل الفيديو</a>
 </div>
</div>

<script>
/* ================= الإعدادات ================= */
const W=1080,H=1920,N=8,TR=1.2;
// بداية كل مشهد بالثانية، مضبوطة على جمل المعلق الصوتي
const STARTS=[0,6.0,11.2,15.9,21.0,26.2,30.9,36.6],TOTAL=46.6;
const DUR=STARTS.map((s,i)=>(i<N-1?STARTS[i+1]:TOTAL)-s);      // 9:16، 8 مشاهد، 60 ثانية
const GOLD='#d6b765',GOLD_HI='#ffdf91',CREAM='#fff6dc',SOFT='#dfc58d';
const $=id=>document.getElementById(id);
const canvas=$('stage');canvas.width=W;canvas.height=H;
const ctx=canvas.getContext('2d');

/* ================= أدوات مساعدة ================= */
let seed=20260;
const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;   // عشوائية ثابتة
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOut=x=>1-Math.pow(1-clamp(x),3);
const fadeIn=(lt,s,d=1)=>ease((lt-s)/d);
const rise=(lt,s,d=1,dist=40)=>({a:fadeIn(lt,s,d),dy:(1-easeOut((lt-s)/d))*dist});
const lerp=(a,b,k)=>a+(b-a)*k;

/* ================= طبقات ثابتة مسبقاً ================= */
const sky=document.createElement('canvas');sky.width=W;sky.height=H;
const vig=document.createElement('canvas');vig.width=W;vig.height=H;
const moonBuf=document.createElement('canvas');moonBuf.width=1000;moonBuf.height=1000;
(function buildLayers(){
 const g=sky.getContext('2d');
 const bg=g.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#02050d');bg.addColorStop(.5,'#0a1a3d');bg.addColorStop(1,'#16305f');
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 let rg=g.createRadialGradient(260,520,0,260,520,760);
 rg.addColorStop(0,'rgba(90,110,220,.22)');rg.addColorStop(1,'rgba(90,110,220,0)');
 g.fillStyle=rg;g.fillRect(0,0,W,H);
 rg=g.createRadialGradient(820,1350,0,820,1350,820);
 rg.addColorStop(0,'rgba(214,183,101,.10)');rg.addColorStop(1,'rgba(214,183,101,0)');
 g.fillStyle=rg;g.fillRect(0,0,W,H);
 const v=vig.getContext('2d');
 const vg=v.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);
 vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
 v.fillStyle=vg;v.fillRect(0,0,W,H);
})();

const STARS=Array.from({length:160},()=>({x:rnd()*W,y:rnd()*H,r:.6+rnd()*2.2,p:rnd()*6.28}));
const DUST=Array.from({length:90},()=>({x:rnd()*W,y0:rnd()*H,v:18+rnd()*34,r:1+rnd()*2.6,p:rnd()*6.28}));
const HEARTS=Array.from({length:22},()=>({x:rnd()*W,o:rnd()*H,v:70+rnd()*90,s:16+rnd()*30,p:rnd()*6.28}));
const LANTERNS=[
 {x:130,len:700,s:1.0,ph:0},{x:320,len:960,s:1.15,ph:1.3},{x:540,len:640,s:1.3,ph:2.1},
 {x:760,len:1000,s:1.15,ph:.6},{x:950,len:780,s:1.0,ph:2.8}
];
const SPARKS=Array.from({length:30},()=>({an:rnd()*6.283,d:300+rnd()*750,a:.4+rnd()*.6,r:2+rnd()*4}));
const DATES=[[-190,-14],[-95,-30],[0,-40],[95,-30],[190,-14],[-140,18],[-45,14],[45,14],[140,18]];

/* ================= رسم عام ================= */
function halo(x,y,r,rgb,a){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);
 ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function drawStars(t){
 for(const s of STARS){
  ctx.globalAlpha=.25+.75*(.5+.5*Math.sin(t*1.8+s.p));
  ctx.fillStyle=CREAM;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
}
function txt(s,x,y,size,color,o={}){
 const {w=700,font='Cairo',a=1,glow=0,lh=1.6,dy=0}=o;
 if(a<=0)return;
 ctx.save();
 ctx.globalAlpha*=a;
 ctx.font=`${w} ${size}px ${font}, Tahoma, Arial, sans-serif`;
 ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle=color;
 if(glow){ctx.shadowColor=color;ctx.shadowBlur=glow;}
 s.split('\n').forEach((ln,i,arr)=>ctx.fillText(ln,x,y+dy+(i-(arr.length-1)/2)*size*lh));
 ctx.restore();
}
function drawCrescent(cx,cy,r,rot=0,alpha=1){
 const m=moonBuf.getContext('2d');
 m.globalCompositeOperation='source-over';m.clearRect(0,0,1000,1000);
 const mg=m.createRadialGradient(420,380,40,500,500,420);
 mg.addColorStop(0,'#fff8dc');mg.addColorStop(.55,'#ffdf91');mg.addColorStop(1,'#b8893a');
 m.fillStyle=mg;m.beginPath();m.arc(500,500,400,0,Math.PI*2);m.fill();
 m.globalCompositeOperation='destination-out';
 m.beginPath();m.arc(650,440,340,0,Math.PI*2);m.fill();
 m.globalCompositeOperation='source-over';
 ctx.save();
 ctx.globalAlpha*=alpha;
 ctx.translate(cx,cy);ctx.rotate(rot);
 ctx.shadowColor='rgba(255,215,120,.9)';ctx.shadowBlur=Math.min(90,r*.35);
 ctx.drawImage(moonBuf,-r*1.25,-r*1.25,r*2.5,r*2.5);
 ctx.restore();
}
function polyStar(cx,cy,R,r,n,rot){
 ctx.beginPath();
 for(let i=0;i<n*2;i++){
  const rad=i%2?r:R,a=rot+i*Math.PI/n;
  const x=cx+rad*Math.cos(a),y=cy+rad*Math.sin(a);
  if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
 }
 ctx.closePath();
}
function heart(x,y,s){
 ctx.beginPath();
 for(let i=0;i<=60;i++){
  const t=i/60*Math.PI*2;
  const hx=16*Math.pow(Math.sin(t),3);
  const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  const px=x+hx*s/17,py=y-hy*s/17;
  if(i)ctx.lineTo(px,py);else ctx.moveTo(px,py);
 }
 ctx.closePath();
}

/* ================= الفوانيس ================= */
function drawLantern(x,y,s,t){
 const flick=.88+.12*Math.sin(t*7.3)*Math.sin(t*3.1+1);
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 halo(0,10,190,'255,190,80',.42*flick);
 // الشريط المتدلي
 ctx.strokeStyle='#8a6a2a';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,76);ctx.lineTo(0,100);ctx.stroke();
 ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(0,108,9,0,Math.PI*2);ctx.fill();
 // الجسم
 ctx.beginPath();ctx.ellipse(0,0,56,74,0,0,Math.PI*2);
 const bg=ctx.createRadialGradient(0,-8,4,0,0,80);
 bg.addColorStop(0,'#fff6cf');bg.addColorStop(.45,'#ffd36b');bg.addColorStop(1,'#a8762a');
 ctx.fillStyle=bg;ctx.fill();
 ctx.save();
 ctx.clip();
 ctx.strokeStyle='rgba(110,70,15,.5)';ctx.lineWidth=3;
 for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*20,-78);ctx.quadraticCurveTo(k*34,0,k*20,78);ctx.stroke();}
 ctx.fillStyle=`rgba(255,250,225,${.35*flick})`;
 ctx.beginPath();ctx.ellipse(0,0,22,30,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
 ctx.strokeStyle='#8a6a2a';ctx.lineWidth=3;
 ctx.beginPath();ctx.ellipse(0,0,56,74,0,0,Math.PI*2);ctx.stroke();
 // الغطاء والحلقة والقاعدة
 ctx.fillStyle='#8a6a2a';ctx.fillRect(-22,-86,44,14);ctx.fillRect(-22,74,44,12);
 ctx.strokeStyle=GOLD;ctx.lineWidth=4;
 ctx.beginPath();ctx.arc(0,-98,8,0,Math.PI*2);ctx.stroke();
 ctx.restore();
}

/* ================= المشاهد ================= */
// 1) الهلال والنجوم
function sceneIntro(lt){
 const g=easeOut(lt/2.4);
 halo(540,760,520*g+60,'255,220,140',.22*g);
 drawCrescent(540,720+(1-g)*90,230*g+1,-.35,g);
 if(lt<3.2){
  const sx=lerp(-700,W+700,easeOut(lt/3.2));
  ctx.save();ctx.translate(sx,H/2);ctx.rotate(-.5);
  const sg=ctx.createLinearGradient(-260,0,260,0);
  sg.addColorStop(0,'rgba(255,240,200,0)');sg.addColorStop(.5,'rgba(255,240,200,.14)');sg.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=sg;ctx.fillRect(-260,-1400,520,2800);ctx.restore();
 }
 const r1=rise(lt,1.3,1.3,50);
 txt('رمضان',540,1120,250,GOLD_HI,{a:r1.a,dy:r1.dy,glow:45});
 const r2=rise(lt,2.3);
 txt('شهر الرحمة والنور',540,1268,66,CREAM,{a:r2.a,dy:r2.dy});
 const r3=rise(lt,3.1);
 txt('يا مرحبا بشهر الخير والبركة',540,1365,42,SOFT,{a:r3.a,dy:r3.dy});
 txt('RAMADAN KAREEM',540,1700,34,GOLD,{w:400,a:fadeIn(lt,3.8,1)});
}

// 2) الفوانيس الذهبية
function sceneLanterns(lt){
 halo(540,1100,900,'255,170,70',.12);
 LANTERNS.forEach((ln,j)=>{
  const k=easeOut((lt-j*.18)/1.5);
  const drop=(k-1)*380;
  const sw=Math.sin(lt*1.3+ln.ph)*.07+Math.sin(lt*.4+ln.ph)*.03;
  ctx.save();
  ctx.translate(ln.x,-60+drop);ctx.rotate(sw);
  ctx.strokeStyle='rgba(214,183,101,.6)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,ln.len-86*ln.s);ctx.stroke();
  drawLantern(0,ln.len,ln.s,lt+ln.ph);
  ctx.restore();
 });
 const r1=rise(lt,1.2,1.2,40);
 txt('نورٌ يملأ القلوب',540,1280,92,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,2.1);
 txt('تهدأ النفوس وتتجدد الأمنيات\nويحل الخير في كل مكان',540,1420,46,CREAM,{a:r2.a,dy:r2.dy});
}

// 3) الزخارف الإسلامية
function sceneQuran(lt){
 const cx=540,cy=760,R=380,rot=lt*.12;
 const a=fadeIn(lt,0,1.2);
 halo(cx,cy,R*1.3,'214,183,101',.16*a);
 ctx.save();ctx.globalAlpha*=a;ctx.lineWidth=2.5;
 for(let k=0;k<4;k++){
  ctx.beginPath();ctx.arc(cx,cy,R*(1-k*.2),0,Math.PI*2);
  ctx.strokeStyle=`rgba(214,183,101,${.2+k*.1})`;ctx.stroke();
 }
 polyStar(cx,cy,R*.92,R*.4,8,rot);
 ctx.fillStyle='rgba(214,183,101,.06)';ctx.fill();
 ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.stroke();
 polyStar(cx,cy,R*.62,R*.3,8,-rot*1.6+Math.PI/8);
 ctx.strokeStyle='rgba(255,223,145,.8)';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle=GOLD_HI;
 for(let i=0;i<8;i++){
  const an=rot+i*Math.PI/4;
  ctx.beginPath();ctx.arc(cx+R*.92*Math.cos(an),cy+R*.92*Math.sin(an),6,0,Math.PI*2);ctx.fill();
 }
 ctx.beginPath();ctx.arc(cx,cy,28,0,Math.PI*2);
 ctx.shadowColor=GOLD_HI;ctx.shadowBlur=40;ctx.fill();
 ctx.restore();
 const r1=rise(lt,1.2,1.2,40);
 txt('شهر القرآن',540,1230,96,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,2.1);
 txt('نقترب من ربنا\nوتطمئن أرواحنا بالذكر والطاعة',540,1370,46,CREAM,{a:r2.a,dy:r2.dy});
}

// 4) المسجد
function drawMosque(cx,base,a){
 ctx.save();ctx.globalAlpha*=a;
 halo(cx,base-260,520,'255,190,90',.18);
 const body='#0a1a3b';
 ctx.fillStyle=body;ctx.strokeStyle='rgba(214,183,101,.6)';ctx.lineWidth=3;
 ctx.fillRect(cx-280,base-300,560,300);                       // الصحن
 ctx.beginPath();ctx.arc(cx,base-300,210,Math.PI,0);ctx.fill();ctx.stroke(); // القبة
 ctx.beginPath();ctx.moveTo(cx,base-510);ctx.lineTo(cx,base-575);ctx.stroke();
 [cx-340,cx+280].forEach(mx=>{                                // المئذنتان
  ctx.fillStyle=body;ctx.fillRect(mx,base-620,60,620);
  ctx.fillRect(mx-10,base-470,80,16);
  ctx.beginPath();ctx.moveTo(mx-6,base-620);ctx.lineTo(mx+30,base-770);ctx.lineTo(mx+66,base-620);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(mx+30,base-778,8,0,Math.PI*2);ctx.fillStyle=GOLD_HI;ctx.fill();
 });
 drawCrescent(cx,base-600,34,0,1);                            // هلال القبة
 // النوافذ المضاءة
 const arch=(x,yb,w,h)=>{
  ctx.beginPath();ctx.moveTo(x-w/2,yb);ctx.lineTo(x-w/2,yb-h+w/2);
  ctx.arc(x,yb-h+w/2,w/2,Math.PI,0);ctx.lineTo(x+w/2,yb);ctx.closePath();
 };
 const wg=ctx.createLinearGradient(0,base-260,0,base-60);
 wg.addColorStop(0,'rgba(255,220,140,.95)');wg.addColorStop(1,'rgba(255,170,70,.85)');
 ctx.fillStyle=wg;
 for(let k=-2;k<=2;k++){
  arch(cx+k*90,base-190,52,110);ctx.fill();
  arch(cx+k*90,base-70,52,110);ctx.fill();
 }
 arch(cx,base,120,200);ctx.fill();                            // الباب
 ctx.fillStyle='#050d20';ctx.fillRect(0,base,W,H-base);       // الأرض
 ctx.restore();
}
function sceneMosque(lt){
 const up=easeOut(lt/4);
 const my=lerp(1500,820,up);
 halo(540,my,420,'255,225,150',.2*up);
 drawCrescent(540,my,130,-.25,1);
 const sink=(1-easeOut(lt/1.6))*320;
 drawMosque(540,1700+sink,fadeIn(lt,0,.8));
 const r1=rise(lt,.5,1);
 txt('ليالٍ مباركة',540,420,100,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,1.2);
 txt('دعوات صادقة وقلوب خاشعة\nورجاء برحمة الرحمن',540,540,44,CREAM,{a:r2.a,dy:r2.dy});
}

// 5) الإفطار والتمر
function drawDate(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.rotate(-.35);
 const g=ctx.createRadialGradient(-6,-6,2,0,0,36);
 g.addColorStop(0,'#b2652e');g.addColorStop(.6,'#7a3a16');g.addColorStop(1,'#3a1808');
 ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,34*s,22*s,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='rgba(255,220,160,.35)';
 ctx.beginPath();ctx.ellipse(-10*s,-8*s,12*s,5*s,0,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function cup(x,y,a){
 ctx.save();ctx.globalAlpha*=a;
 const top=y-150;
 ctx.beginPath();ctx.moveTo(x-50,top);ctx.lineTo(x+50,top);ctx.lineTo(x+36,y);ctx.lineTo(x-36,y);ctx.closePath();
 ctx.fillStyle='rgba(255,236,190,.14)';ctx.fill();
 ctx.save();ctx.clip();
 ctx.fillStyle='rgba(235,160,60,.7)';ctx.fillRect(x-60,top+50,120,120);
 ctx.restore();
 ctx.strokeStyle='rgba(255,240,200,.7)';ctx.lineWidth=3;ctx.stroke();
 ctx.restore();
}
function sceneIftar(lt){
 halo(540,1150,820,'255,150,60',.22);
 const tg=ctx.createLinearGradient(0,1380,0,H);
 tg.addColorStop(0,'#3a2314');tg.addColorStop(1,'#0c0603');
 ctx.fillStyle=tg;ctx.fillRect(0,1380,W,H-1380);
 ctx.strokeStyle='rgba(214,183,101,.5)';ctx.lineWidth=3;
 ctx.beginPath();ctx.moveTo(0,1380);ctx.lineTo(W,1380);ctx.stroke();
 cup(250,1270,fadeIn(lt,1.8,.9));
 cup(830,1270,fadeIn(lt,2.1,.9));
 ctx.beginPath();ctx.ellipse(540,1400,330,92,0,0,Math.PI*2);
 ctx.fillStyle='#efe3c6';ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=5;ctx.stroke();
 ctx.beginPath();ctx.ellipse(540,1400,260,70,0,0,Math.PI*2);
 ctx.strokeStyle='rgba(214,183,101,.5)';ctx.lineWidth=2;ctx.stroke();
 DATES.forEach(([dx,dy],i)=>{
  const k=easeOut((lt-.5-i*.12)/.9);
  if(k<=0)return;
  ctx.save();ctx.globalAlpha*=clamp(k*1.5);
  drawDate(540+dx,1400+dy-(1-k)*420,1);
  ctx.restore();
 });
 const r1=rise(lt,.4,1);
 txt('على مائدة الإفطار',540,640,88,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,1.1);
 txt('تحلو اللحظات وتلتقي القلوب',540,750,46,CREAM,{a:r2.a,dy:r2.dy});
 txt('فرحةُ الصائم عند إفطاره',540,1640,40,GOLD,{a:fadeIn(lt,3,1)});
}

// 6) العطاء
function sceneGiving(lt){
 halo(540,760,520,'255,190,90',.14);
 HEARTS.forEach(h=>{
  const y=H+60-((h.o+lt*h.v)%(H+160));
  const x=h.x+Math.sin(lt*1.1+h.p)*30;
  ctx.fillStyle=`rgba(214,183,101,${.3+.25*Math.sin(lt+h.p)})`;
  heart(x,y,h.s);ctx.fill();
 });
 const pulse=1+.05*Math.sin(lt*3.2);
 ctx.save();
 ctx.globalAlpha*=fadeIn(lt,0,1);
 ctx.translate(540,740);ctx.scale(pulse,pulse);
 ctx.shadowColor=GOLD_HI;ctx.shadowBlur=60;
 heart(0,0,200);
 const hg=ctx.createLinearGradient(-200,-200,200,200);
 hg.addColorStop(0,'#ffe9a8');hg.addColorStop(1,'#b8863a');
 ctx.fillStyle=hg;ctx.fill();
 ctx.restore();
 const r1=rise(lt,1.2,1.2,40);
 txt('شهر العطاء',540,1200,100,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,2.1);
 txt('الخير يكبر بالمشاركة\nوالفرحة تحلى يوم نعطي غيرنا',540,1340,46,CREAM,{a:r2.a,dy:r2.dy});
}

// 7) العشر الأواخر
function sceneNights(lt){
 const cx=540,cy=640,a=fadeIn(lt,0,1.2);
 halo(cx,cy,620,'255,225,150',.2*a);
 ctx.save();ctx.globalAlpha*=a*.12;ctx.translate(cx,cy);ctx.rotate(lt*.05);
 for(let i=0;i<24;i++){
  ctx.rotate(Math.PI/12);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-40,-900);ctx.lineTo(40,-900);ctx.closePath();
  ctx.fillStyle=GOLD_HI;ctx.fill();
 }
 ctx.restore();
 drawCrescent(cx,cy,170*easeOut(lt/1.6)+1,.2,a);
 for(let s=0;s<3;s++){                                        // نجوم ساقطة
  const period=3.4,p=((lt+s*1.1)%period)/period;
  if(p<.35){
   const q=p/.35;
   const hx=1120-820*q,hy=180+520*q;
   const tx=hx+180,ty=hy-110;
   const g=ctx.createLinearGradient(tx,ty,hx,hy);
   g.addColorStop(0,'rgba(255,240,200,0)');g.addColorStop(1,'rgba(255,250,225,1)');
   ctx.save();ctx.globalAlpha*=(1-q*.4);
   ctx.strokeStyle=g;ctx.lineWidth=3;ctx.lineCap='round';
   ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(hx,hy);ctx.stroke();
   ctx.restore();
  }
 }
 const r1=rise(lt,1.2,1.2,40);
 txt('العشر الأواخر',540,1200,100,GOLD_HI,{a:r1.a,dy:r1.dy,glow:30});
 const r2=rise(lt,2.1);
 txt('اللهم بلغنا ليلة القدر\nواكتب لنا الخير والمغفرة',540,1340,46,CREAM,{a:r2.a,dy:r2.dy});
 txt('ليلةُ القدر خيرٌ من ألف شهر',540,1510,40,GOLD,{a:fadeIn(lt,3,1)});
}

// 8) الختام
function sceneEnd(lt){
 const a=fadeIn(lt,0,1.4);
 halo(540,720,700,'255,220,140',.25*a);
 ctx.save();ctx.globalAlpha*=a;
 polyStar(540,720,300,160,8,lt*.08);
 ctx.strokeStyle='rgba(214,183,101,.5)';ctx.lineWidth=2;ctx.stroke();
 ctx.restore();
 drawCrescent(540,720,150,-.25,a);
 const r1=rise(lt,.6,1.2,50);
 txt('رمضان كريم',540,1120,150,GOLD_HI,{a:r1.a,dy:r1.dy,glow:50});
 const r2=rise(lt,1.6);
 txt('تقبل الله منا ومنكم\nصالح الأعمال',540,1270,50,CREAM,{a:r2.a,dy:r2.dy});
 txt('كل عام وأنتم بخير',540,1480,56,GOLD,{a:fadeIn(lt,2.8,1)});
}

const SCENES=[sceneIntro,sceneLanterns,sceneQuran,sceneMosque,sceneIftar,sceneGiving,sceneNights,sceneEnd];

/* ================= التركيب والانتقالات ================= */
let fadeOn=false;                         // الظلام في البداية يُفعَّل عند التشغيل/التصدير فقط
function drawScene(i,lt,a,z){
 if(a<=.001)return;
 ctx.save();
 ctx.globalAlpha=a;
 const zoom=z*(1+.03*clamp(lt/DUR[i]));   // تكبير بطيء داخل المشهد
 if(zoom!==1){ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);}
 SCENES[i](lt);
 ctx.restore();
}
function drawOverlay(t){
 ctx.globalAlpha=1;
 for(const d of DUST){
  const y=H-((d.y0+t*d.v)%H);
  const x=d.x+Math.sin(t*.7+d.p)*18;
  ctx.globalAlpha=.8*(.25+.5*(.5+.5*Math.sin(t*1.6+d.p)));
  ctx.fillStyle='#ffe7a6';ctx.beginPath();ctx.arc(x,y,d.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 ctx.drawImage(vig,0,0);
 ctx.strokeStyle='rgba(214,183,101,.45)';ctx.lineWidth=3;
 ctx.strokeRect(36,36,W-72,H-72);
 let black=0;
 if(fadeOn&&t<.8)black=1-t/.8;
 if(t>TOTAL-1)black=Math.max(black,(t-(TOTAL-1))/1);
 if(black>0){ctx.fillStyle=`rgba(0,0,0,${black})`;ctx.fillRect(0,0,W,H);}
}
// وميض وشرارات عند بداية كل مشهد
function drawFlare(lt){
 const p=clamp(lt/1.4),a=1-p;
 if(a<=0)return;
 ctx.save();
 ctx.globalAlpha=a*.9;
 ctx.translate(lerp(-400,W+400,easeOut(p)),H/2);ctx.rotate(-.5);
 const sg=ctx.createLinearGradient(-180,0,180,0);
 sg.addColorStop(0,'rgba(255,240,200,0)');sg.addColorStop(.5,'rgba(255,240,200,.22)');sg.addColorStop(1,'rgba(255,240,200,0)');
 ctx.fillStyle=sg;ctx.fillRect(-180,-1400,360,2800);
 ctx.restore();
 ctx.save();ctx.translate(W/2,H/2);ctx.fillStyle=GOLD_HI;
 for(const s of SPARKS){
  const r=easeOut(p)*s.d;
  ctx.globalAlpha=a*s.a;
  ctx.beginPath();ctx.arc(Math.cos(s.an)*r,Math.sin(s.an)*r,s.r*(1-p*.5),0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function render(t){
 t=clamp(t,0,TOTAL);
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
 ctx.drawImage(sky,0,0);
 drawStars(t);
 let i=0;
 while(i<N-1&&t>=STARTS[i+1])i++;
 const lt=t-STARTS[i];
 if(i>0&&lt<TR){
  const k=ease(lt/TR);
  drawScene(i-1,t-STARTS[i-1],1-k,1);       // المشهد السابق يتلاشى
  drawScene(i,lt,k,1+.05*(1-k));             // المشهد الجديد يكبر بسلاسة
 }else{
  drawScene(i,lt,1,1);
 }
 if(i>0&&lt<1.4)drawFlare(lt);
 drawOverlay(t);
}

/* ================= الواجهة والتشغيل ================= */
const playBtn=$('play'),resetBtn=$('reset'),exportBtn=$('export');
const bar=$('bar'),clock=$('clock'),statusEl=$('status'),dl=$('download'),vol=$('volume');
let t=0,playing=false,recording=false,t0=0,raf=0,audio=null,audioURL=null,actx=null;

function fmtTime(s){
 const m=Math.floor(s/60),x=Math.floor(s%60);
 return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');
}
function updateUI(x){
 bar.style.width=(x/TOTAL*100)+'%';
 clock.textContent=fmtTime(x)+' / '+fmtTime(TOTAL);
}
function setBusy(b){exportBtn.disabled=b;playBtn.disabled=b;resetBtn.disabled=b;}

// رسم الصوت عبر AudioContext واحد (createMediaElementSource يُستدعى مرة واحدة لكل عنصر)
function audioGraph(){
 if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
 if(!audio._node){
  audio._node=actx.createMediaElementSource(audio);
  audio._node.connect(actx.destination);
 }
 return actx;
}

function frame(now){
 if(!playing)return;
 t=(now-t0)/1000;
 if(t>=TOTAL){
  t=TOTAL;render(t);updateUI(t);
  stopPlayback();fadeOn=false;
  statusEl.textContent='انتهى العرض. يمكنك التصدير الآن.';
  return;
 }
 render(t);updateUI(t);
 raf=requestAnimationFrame(frame);
}
function startPlayback(){
 if(recording)return;
 if(t>=TOTAL)t=0;
 playing=true;fadeOn=true;
 t0=performance.now()-t*1000;
 if(audio){
  try{audioGraph().resume().catch(()=>{});}catch(e){}
  audio.currentTime=t;audio.play().catch(()=>{});
 }
 playBtn.textContent='❚❚ إيقاف مؤقت';
 statusEl.textContent='';
 raf=requestAnimationFrame(frame);
}
function stopPlayback(){
 playing=false;cancelAnimationFrame(raf);
 if(audio)audio.pause();
 playBtn.textContent='▶ تشغيل';
}
function seek(x){
 t=clamp(x,0,TOTAL);
 render(t);updateUI(t);
 if(audio)audio.currentTime=t;
}

playBtn.onclick=()=>playing?stopPlayback():startPlayback();
resetBtn.onclick=()=>{
 if(recording)return;
 stopPlayback();fadeOn=false;seek(0);
 statusEl.textContent='تمت الإعادة.';
};
vol.oninput=e=>{if(audio)audio.volume=Number(e.target.value);};
$('audioFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 stopPlayback();
 if(audioURL)URL.revokeObjectURL(audioURL);
 audioURL=URL.createObjectURL(f);
 audio=new Audio(audioURL);
 audio.preload='auto';
 audio.volume=Number(vol.value);
 statusEl.textContent='تم تحميل الصوت. اضغطي تشغيل للمعاينة.';
};

/* ================= التصدير ================= */
function pickMime(){
 // H.264 داخل MP4 يعمل على الآيفون والماك والويندوز؛ ثم أي MP4؛ ثم WebM كاحتياط
 const list=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
 return list.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
async function exportVideo(){
 if(recording)return;
 if(!canvas.captureStream||!window.MediaRecorder){
  statusEl.textContent='التصدير غير مدعوم في هذا المتصفح. جرّبي Chrome أو Safari محدّثًا.';
  return;
 }
 const mime=pickMime();
 if(!mime){statusEl.textContent='صيغة الفيديو غير مدعومة في هذا المتصفح.';return;}

 stopPlayback();
 recording=true;fadeOn=true;
 setBusy(true);
 dl.hidden=true;
 const cleanup=[];
 let stream=null;
 try{
  stream=canvas.captureStream(30);
  if(audio){
   const ac=audioGraph();
   await ac.resume();
   const dest=ac.createMediaStreamDestination();
   audio._node.connect(dest);
   cleanup.push(()=>{try{audio._node.disconnect(dest);}catch(e){}});
   stream=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]);
   audio.volume=Number(vol.value);
   audio.currentTime=0;
  }
  const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime});
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onerror=()=>{statusEl.textContent='حدث خطأ أثناء التسجيل.'};
  rec.onstop=()=>{
   const type=mime.split(';')[0];
   const ext=type.includes('mp4')?'mp4':'webm';
   const blob=new Blob(chunks,{type});
   dl.href=URL.createObjectURL(blob);
   dl.download='ramadan-motion.'+ext;
   dl.textContent='تنزيل الفيديو ('+ext.toUpperCase()+' - '+(blob.size/1048576).toFixed(1)+' MB)';
   dl.hidden=false;
   stream.getTracks().forEach(tr=>tr.stop());
   cleanup.forEach(f=>f());
   recording=false;fadeOn=false;setBusy(false);
   statusEl.textContent=ext==='mp4'
    ?'اكتمل التصدير بصيغة MP4. اضغطي تنزيل الفيديو.'
    :'اكتمل التصدير بصيغة WebM. اضغطي تنزيل الفيديو (انظري تعليمات التحويل إلى MP4 أدناه).';
  };
  rec.start(500);
  if(audio){await audio.play().catch(()=>{});}
  const begin=performance.now();
  statusEl.textContent='جارٍ التصدير... أبقي الصفحة مفتوحة وظاهرة لمدة دقيقة.';
  const step=now=>{
   const x=(now-begin)/1000;
   if(x>=TOTAL){
    render(TOTAL);updateUI(TOTAL);
    if(audio)audio.pause();
    setTimeout(()=>rec.stop(),150);
    return;
   }
   render(x);updateUI(x);
   requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
 }catch(err){
  cleanup.forEach(f=>{try{f();}catch(e){}});
  if(stream)stream.getTracks().forEach(tr=>tr.stop());
  recording=false;fadeOn=false;setBusy(false);
  statusEl.textContent='تعذر التصدير: '+err.message;
 }
}
exportBtn.onclick=exportVideo;

/* ================= بدء التشغيل ================= */
render(0);updateUI(0);
(async()=>{
 try{
  await Promise.race([
   Promise.all(['900 100px Cairo','700 50px Cairo','400 40px Cairo','700 100px Amiri']
    .map(f=>document.fonts.load(f))),
   new Promise(r=>setTimeout(r,2500))
  ]);
 }catch(e){}
 render(0);
 statusEl.textContent='جاهز للتشغيل';
})();
</script>
